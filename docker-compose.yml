services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
